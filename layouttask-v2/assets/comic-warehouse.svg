<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101421"/><stop offset=".55" stop-color="#182236"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff1688"/><stop offset="1" stop-color="#a60058"/></linearGradient>
 <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#ff4caa" opacity=".48"/></pattern>
 <pattern id="blueDots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#54bfff" opacity=".35"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<path d="M0 0H650L310 1000H0Z" fill="url(#dots)" opacity=".7"/>
<path d="M1160 0H1600V1000H1370Z" fill="url(#blueDots)" opacity=".65"/>
<path d="M0 740L420 0H570L150 1000H0Z" fill="#ff1688" opacity=".08"/>
