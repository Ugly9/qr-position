 <path d="M70 0L30 170L210 170L260 145"/><path d="M65 0L25 -30"/><circle cx="55" cy="185" r="22" fill="#ff1688"/><circle cx="210" cy="185" r="22" fill="#ff1688"/>
 <path d="M85 70H205V135H65Z" fill="#ff1688" stroke="#ff1688"/>
</g>
