<g stroke="#101421" stroke-width="7" stroke-linejoin="round">
 <g fill="#f6f4f8"><rect x="525" y="278" width="72" height="72" rx="5"/><rect x="625" y="278" width="72" height="72" rx="5"/><rect x="775" y="278" width="72" height="72" rx="5"/><rect x="875" y="278" width="72" height="72" rx="5"/><rect x="1025" y="278" width="72" height="72" rx="5"/></g>
 <g fill="#ff4caa"><rect x="550" y="380" width="92" height="62" rx="5"/><rect x="720" y="380" width="92" height="62" rx="5"/><rect x="890" y="380" width="92" height="62" rx="5"/></g>
 <g fill="#49b8ff"><rect x="650" y="380" width="52" height="62" rx="5"/><rect x="990" y="380" width="52" height="62" rx="5"/></g>
</g>
<!-- foreground floor -->
<path d="M0 650L1600 590V1000H0Z" fill="#080d18" opacity=".65"/>
