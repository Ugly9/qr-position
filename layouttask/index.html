align-items:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.nav{border:0;background:none;color:#7f91a9;font-size:10px;min-width:56px;padding:7px 4px}.nav b{display:block;font-size:20px;line-height:1.2}.nav.active{color:#5ea2ff}.fab{width:57px;height:57px;border:0;border-radius:50%;background:linear-gradient(135deg,#208aff,#7c58ff);color:#fff;font-size:29px;box-shadow:0 8px 24px #4a54ff55}.toast{display:none;position:fixed;z-index:100;left:50%;bottom:calc(91px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);background:#15263d;border:1px solid #3c5878;border-radius:13px;padding:11px 15px;box-shadow:0 10px 25px #0007;text-align:center}.shareRow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.warning{background:#301f0d;border:1px solid #6d4b21;color:#ffdca8;border-radius:13px;padding:11px;font-size:13px;margin:10px 0}.annotWrap{position:relative;width:100%;background:#05080d;border-radius:17px;overflow:hidden;border:1px solid #263952}.annotCanvas{display:block;width:100%;height:auto;touch-action:none}.annotTools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.annotTools button{min-height:46px}.readonly .bottom,.readonly .top .brandActions{display:none}@media(min-width:700px){.app{box-shadow:0 0 80px #0009}.report{padding:22px}.reportItem img{max-height:620px}}@media print{body{background:#fff}.app{max-width:none;background:#fff;padding:0}.top,.bottom,.noPrint,.back{display:none!important}.screen{padding:0}.report{box-shadow:none;border-radius:0}.reportItem{break-inside:avoid}.reportItem img{max-height:700px}}

<body><main id="app" class="app"><div class="top">NOTINO <span>&nbsp;LayoutTask</span></div><div class="screen"><div class="empty">Načítám aplikaci…</div></div></main><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';
const AKEY='LT_ACTIONS_FINAL',SKEY='LT_SECTIONS_FINAL';
const defA=['Obnova cedulky','Obnova layoutu','Obnova cedulky a layoutu','Vytvorit novu layout'];
const defS={DC2:['A','B','C','D','E'],DC3:['Sekce 1.01','Sekce 1.02']};
const oldDefaultDC3=['Vrata','VZV','Trideni','Pas','3/5','Kamion','Hellman'];
const load=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let actions=load(AKEY,defA.slice());let sections=load(SKEY,JSON.parse(JSON.stringify(defS)));
if(!Array.isArray(actions)||!actions.length)actions=defA.slice();if(!sections||!Array.isArray(sections.DC2)||!Array.isArray(sections.DC3))sections=JSON.parse(JSON.stringify(defS));if(Array.isArray(sections.DC3)&&sections.DC3.length===oldDefaultDC3.length&&sections.DC3.every((x,i)=>x===oldDefaultDC3[i])){sections.DC3=defS.DC3.slice();save(SKEY,sections)}
const SUPABASE_URL='https://hsrznmfeqajffrleeyly.supabase.co';
const SUPABASE_KEY='sb_publishable_lQBoAETsI3XjQV21G4mpIQ_2xBzbsBT';

let reports=[];let db=null;let st={dc:null,sec:null,photo:null,act:null,comment:'',items:[],edit:-1,report:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function nav(a){return `<div class="bottom"><button class="nav ${a==='home'?'active':''}" onclick="home()"><b>⌂</b>Home</button><button class="nav ${a==='history'?'active':''}" onclick="historyScreen()"><b>◷</b>History</button><button class="fab" aria-label="New report" onclick="chooseDC()">＋</button><button class="nav ${a==='reports'?'active':''}" onclick="reportsScreen()"><b>▤</b>Reports</button><button class="nav ${a==='settings'?'active':''}" onclick="settings()"><b>⚙</b>Settings</button></div>`}
function shell(title,body,active,backFn='home()'){return `<div class="top">NOTINO <span>&nbsp;LayoutTask</span></div><div class="screen">${title?`<button class="back" onclick="${backFn}">‹ Zpět</button><h2 class="heading">${esc(title)}</h2>`:''}${body}</div>${active!==null?nav(active):''}`}
function render(x,readonly=false){const a=document.getElementById('app');a.innerHTML=x;a.classList.toggle('readonly',readonly);window.scrollTo(0,0)}
function resetDraft(){st={dc:null,sec:null,photo:null,act:null,comment:'',items:[],edit:-1,report:null}}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('LayoutTaskDB',2);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('reports'))d.createObjectStore('reports',{keyPath:'id'});};req.onsuccess=e=>{db=e.target.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function dbGetAll(){return new Promise((resolve,reject)=>{const tx=db.transaction('reports','readonly');const r=tx.objectStore('reports').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function dbPut(r){return new Promise((resolve,reject)=>{const tx=db.transaction('reports','readwrite');tx.objectStore('reports').put(r);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function dbDelete(id){return new Promise((resolve,reject)=>{const tx=db.transaction('reports','readwrite');tx.objectStore('reports').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function sortedReports(){return reports.slice().sort((a,b)=>b.created-a.created)}
function reportRow(r){return `<div class="item clickable" onclick="viewReport('${js(r.id)}')"><div class="grow"><div class="itemTitle">${esc(r.dc)} · ${esc(r.sec)}</div><div class="itemMeta">${new Date(r.created).toLocaleString('cs-CZ')} · ${r.items.length} foto</div></div><span style="font-size:22px;color:#78aaff">›</span></div>`}
window.home=function(){resetDraft();const rs=sortedReports().slice(0,3);render(`<div class="top">NOTINO <span>&nbsp;LayoutTask</span></div><div class="screen hero"><div class="eyebrow">Warehouse layout reports</div><h1>Layout<span>Task</span></h1><p class="muted">Rychle vytvoř report přímo ze skladu.</p><div class="grid" style="margin-top:18px"><button class="dc" onclick="chooseSection('DC2')"><span class="iconbig">▣</span><b>DC2</b><small>A · B · C · D · E</small></button><button class="dc purple" onclick="chooseSection('DC3')"><span class="iconbig">▣</span><b>DC3</b><small>2 sekce</small></button></div><div class="card"><div class="cardTitle"><strong>Poslední Reports</strong><button class="linkBtn" onclick="reportsScreen()">Všechny</button></div>${rs.map(reportRow).join('')||'<div class="empty">Zatím žádný report.</div>'}</div></div>${nav('home')}`)};
window.chooseDC=function(){resetDraft();render(shell('Nový Report',`<p class="muted">Vyber DC.</p><div class="grid"><button class="dc" onclick="chooseSection('DC2')"><span class="iconbig">▣</span><b>DC2</b></button><button class="dc purple" onclick="chooseSection('DC3')"><span class="iconbig">▣</span><b>DC3</b></button></div>`,null))};
window.chooseSection=function(dc){st.dc=dc;const list=sections[dc]||[];render(shell('Vyber Section',`<p class="muted">${esc(dc)}</p>${list.map(s=>`<button class="section" onclick="start('${js(s)}')"><span>▣ &nbsp;${esc(s)}</span><span class="arrow">›</span></button>`).join('')}`,null,'chooseDC()'))};
window.start=function(sec){st.sec=sec;st.items=[];st.edit=-1;camera()};
window.camera=function(){render(shell('Photo',`<p class="muted">Vyfotografuj místo, které je potřeba upravit.</p><div class="camera"><span class="cameraMark">▧</span><input id="file" type="file" accept="image/*" capture="environment" onchange="photo(event)"><button class="shutter" aria-label="Camera" onclick="document.getElementById('file').click()"></button></div><div class="card"><span class="badge">${esc(st.dc)} · ${esc(st.sec)}</span><div class="itemMeta" style="margin-top:8px">${st.items.length?st.items.length+' uložených foto':'Připraveno pro focení'}</div></div>${st.items.length?`<button class="secondary" onclick="review()">Zobrazit ${st.items.length} uložených foto</button>`:''}`,null,'reviewOrSection()'))};
window.reviewOrSection=function(){if(st.items.length)review();else chooseSection(st.dc)};
async function imageToDataURL(file,max=1400,quality=.72){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=reject;fr.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const q=Math.min(1,max/w,max/h);w=Math.max(1,Math.round(w*q));h=Math.max(1,Math.round(h*q));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{alpha:false});ctx.drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};im.src=fr.result};fr.readAsDataURL(file)})}
window.photo=async function(e){const f=e.target.files?.[0];if(!f)return;try{st.photo=await imageToDataURL(f);st.act=null;st.comment='';st.edit=-1;actionScreen()}catch(err){toast('Fotku se nepodařilo načíst.')}};
window.actionScreen=function(){const editing=st.edit>=0;render(shell(editing?'Edit Photo':'Action',`<img class="photo" src="${st.photo}"><button class="secondary" style="margin-top:9px" onclick="annotatePhoto()">🖊️ Poznačit na foto</button><label class="label">Action</label><div class="actions">${actions.map(a=>`<button class="action ${st.act===a?'on':''}" onclick="captureComment();selectAction('${js(a)}')"><span class="dot"></span><span>${esc(a)}</span>${st.act===a?'<span class="check">✓</span>':''}</button>`).join('')}</div><label class="label">Comment <span style="font-weight:600">(volitelné)</span></label><textarea id="comment" placeholder="Zadej poznámku…">${esc(st.comment)}</textarea><div class="sticky"><button class="primary" onclick="saveItem()">✓ ${editing?'Uložit změny':'Uložit Photo'}</button><button class="ghost" style="margin-top:8px" onclick="cancelPhoto()">Zrušit</button></div>`,null,'cancelPhoto()'))};
window.annotatePhoto=async function(){
 const src=st.photo;if(!src)return;
 try{
  const base=src.startsWith('data:')?src:await photoToDataURL(src);st.photo=base;
  render(shell('Poznačit foto',`<p class="muted">Nakresli šipku, kroužek nebo jinou poznámku přímo do fotografie.</p><div class="annotWrap"><canvas id="annotCanvas" class="annotCanvas"></canvas></div><div class="annotTools"><button class="secondary" id="undoAnnot" type="button">↶ Zpět</button><button class="secondary" id="clearAnnot" type="button">Vymazat</button><button class="primary" id="doneAnnot" type="button">✓ Hotovo</button></div><button class="ghost" style="margin-top:8px" onclick="actionScreen()">Zrušit</button>`,null,'actionScreen()'));
  const canvas=document.getElementById('annotCanvas'),ctx=canvas.getContext('2d',{alpha:false}),im=new Image();
  const undoBtn=document.getElementById('undoAnnot'),clearBtn=document.getElementById('clearAnnot'),doneBtn=document.getElementById('doneAnnot');
  const undo=()=>{const a=window._annot;if(!a)return;a.drawing=false;if(a.strokes.length>0)a.strokes.pop();annotRedraw();annotUpdateButtons()};
  const clear=()=>{const a=window._annot;if(!a)return;a.drawing=false;a.strokes.length=0;annotRedraw();annotUpdateButtons()};
  const done=()=>{const a=window._annot;if(!a)return;st.photo=a.canvas.toDataURL('image/jpeg',.82);window._annot=null;actionScreen()};
  if(undoBtn){undoBtn.onclick=undo;undoBtn.addEventListener('touchend',e=>{e.preventDefault();undo()},{passive:false});}
  if(clearBtn){clearBtn.onclick=clear;clearBtn.addEventListener('touchend',e=>{e.preventDefault();clear()},{passive:false});}
  if(doneBtn){doneBtn.onclick=done;doneBtn.addEventListener('touchend',e=>{e.preventDefault();done()},{passive:false});}
  im.onload=()=>{canvas.addEventListener('pointerdown',annotStart);canvas.addEventListener('pointermove',annotMove);canvas.addEventListener('pointerup',annotEnd);canvas.addEventListener('pointercancel',annotEnd);const max=1400,scale=Math.min(1,max/im.naturalWidth,max/im.naturalHeight);canvas.width=Math.max(1,Math.round(im.naturalWidth*scale));canvas.height=Math.max(1,Math.round(im.naturalHeight*scale));window._annot={canvas,ctx,baseImage:im,strokes:[],drawing:false};annotRedraw()};im.src=base;
 }catch(e){console.error(e);toast('Foto se nepodařilo připravit pro kreslení.')} 
};
function annotPoint(e){const a=window._annot,c=a.canvas,r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function annotStart(e){const a=window._annot;if(!a)return;e.preventDefault();a.drawing=true;a.strokes.push([annotPoint(e)]);a.canvas.setPointerCapture?.(e.pointerId);annotRedraw()}
function annotMove(e){const a=window._annot;if(!a?.drawing)return;e.preventDefault();a.strokes[a.strokes.length-1].push(annotPoint(e));annotRedraw()}
function annotEnd(e){const a=window._annot;if(!a)return;a.drawing=false;try{a.canvas.releasePointerCapture?.(e.pointerId)}catch(_){}annotUpdateButtons()}
function annotRedraw(){const a=window._annot;if(!a)return;const c=a.canvas,ctx=a.ctx;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(a.baseImage,0,0,c.width,c.height);ctx.strokeStyle='#ff2d55';ctx.fillStyle='#ff2d55';ctx.lineWidth=Math.max(4,c.width/280);ctx.lineCap='round';ctx.lineJoin='round';for(const s of a.strokes){if(!s.length)continue;if(s.length===1){ctx.beginPath();ctx.arc(s[0].x,s[0].y,ctx.lineWidth,0,Math.PI*2);ctx.fill();continue}ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}annotUpdateButtons()}
function annotUpdateButtons(){const a=window._annot;if(!a)return;const u=document.getElementById('undoAnnot'),c=document.getElementById('clearAnnot'),has=a.strokes.length>0;if(u)u.style.opacity=has?'1':'.55';if(c)c.style.opacity=has?'1':'.55'}
window.annotUndo=function(){const a=window._annot;if(!a)return false;a.drawing=false;if(a.strokes.length>0)a.strokes.pop();annotRedraw();return false}
window.annotClear=function(){const a=window._annot;if(!a)return false;a.drawing=false;a.strokes.length=0;annotRedraw();return false}
window.annotDone=function(){const a=window._annot;if(!a)return;st.photo=a.canvas.toDataURL('image/jpeg',.82);window._annot=null;actionScreen()}
window.captureComment=function(){const c=document.getElementById('comment');if(c)st.comment=c.value};
window.selectAction=function(a){st.act=a;actionScreen()};
window.cancelPhoto=function(){st.photo=null;st.act=null;st.comment='';st.edit=-1;if(st.items.length)review();else camera()};
window.saveItem=function(){const c=document.getElementById('comment');if(c)st.comment=c.value;const comment=(st.comment||'').trim();const action=(st.act||'').trim();if(!action&&!comment){toast('Vyber Action nebo zadej Comment.');return}const item={id:st.edit>=0?st.items[st.edit].id:cryptoId(),photo:st.photo,action,comment};if(st.edit>=0)st.items[st.edit]=item;else st.items.push(item);st.photo=null;st.act=null;st.comment='';st.edit=-1;review()};
window.review=function(){render(shell('Report',`<p class="muted">${esc(st.dc)} · ${esc(st.sec)} · ${st.items.length} foto</p>${st.items.map((x,i)=>`<div class="item"><span class="num">${i+1}</span><img class="thumb" src="${x.photo}"><div class="grow"><div class="itemTitle">${esc(x.action)}</div><div class="itemMeta">${esc(x.comment||'Bez komentáře')}</div></div><button class="iconBtn" aria-label="Edit" onclick="editItem(${i})">✎</button><button class="iconBtn" aria-label="Delete" onclick="removeItem(${i})">×</button></div>`).join('')||'<div class="empty">Žádné foto.</div>'}<button class="secondary" style="margin-bottom:9px" onclick="groupDraft()">📦 Seskupit podle Action</button><button class="primary" onclick="camera()">＋ Add Photo</button>${st.items.length?(st.editingReport?'<button class="primary green" style="margin-top:9px" onclick="saveEditedReport()">💾 Uložit změny Reportu</button>':'<button class="primary green" style="margin-top:9px" onclick="createReport()">✓ Finish Report</button>'):''}`,null,'chooseSection(st.dc)'))};
window.editItem=function(i){const x=st.items[i];if(!x)return;st.edit=i;st.photo=x.photo;st.act=x.action;st.comment=x.comment||'';actionScreen()};
window.removeItem=function(i){if(!confirm('Smazat toto foto?'))return;st.items.splice(i,1);review()};
function cryptoId(){try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}}
window.createReport=async function(){
 if(!st.items.length){toast('Nejdříve přidej Photo.');return}
 try{
  const id=cryptoId(), token=cryptoId(), created=Date.now();
  toast('Ukládám Report…');
  const payload={id,token,dc:st.dc,section:st.sec,created,items:st.items.map(x=>({action:x.action,comment:x.comment||'',photo:x.photo}))};
  const res=await fetch(`${SUPABASE_URL}/functions/v1/layouttask-report`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok){const t=await res.text();throw new Error(t||'save_failed')}
  const data=await res.json();
  const r={id,dc:st.dc,sec:st.sec,items:structuredCloneSafe(st.items),created,shareUrl:location.origin+location.pathname+'?r='+encodeURIComponent(data.token),share_token:data.token,remote:true};
  await dbPut(r); reports.push(r); st.report=r; st.editingReport=false; successScreen(r);
 }catch(e){console.error(e);toast('Report se nepodařilo uložit. Zkus znovu.')}};
function structuredCloneSafe(v){return JSON.parse(JSON.stringify(v))}
function successScreen(r){render(shell('Report vytvořen',`<div class="card success"><div class="successIcon">✓</div><h2 style="margin:4px 0">Report je hotový</h2><p class="muted">${esc(r.dc)} · ${esc(r.sec)} · ${r.items.length} foto</p><button class="primary" onclick="shareReport()">📤 Odeslat odkaz na report</button><button class="secondary" style="margin-top:9px" onclick="copyReportRich()">📋 Kopírovat celý Report</button><div class="shareRow"><button class="secondary" onclick="copyReportLink()">Copy Link</button><button class="secondary" onclick="viewReport('${js(r.id)}')">Open Report</button></div></div><button class="ghost" onclick="home()">← Home</button>`,null))}
window.reportsScreen=function(){const rs=sortedReports();render(shell('Reports',`<p class="muted">Všechny vytvořené Reports.</p>${rs.map(reportRow).join('')||'<div class="empty">Zatím žádný report.</div>'}`,'reports'))};
window.historyScreen=function(){const rs=sortedReports();render(shell('History',`<p class="muted">Historie předchozích Reports.</p>${rs.map(reportRow).join('')||'<div class="empty">Historie je prázdná.</div>'}`,'history'))};
window.viewReport=function(id){const r=reports.find(x=>x.id===id);if(!r){toast('Report nebyl nalezen.');return}st.report=r;render(shell('Report',reportHTML(r,false)+`<div class="noPrint" style="margin-top:12px"><button class="primary" onclick="shareReport()">📤 Odeslat odkaz na report</button><button class="secondary" style="margin-top:9px" onclick="copyReportRich()">📋 Kopírovat celý Report</button><button class="secondary" style="margin-top:9px" onclick="groupSavedReport()">📦 Seskupit podle Action</button><button class="secondary" style="margin-top:9px" onclick="editSavedReport()">✎ Upravit Report</button><div class="shareRow"><button class="secondary" onclick="copyReportLink()">Copy Link</button><button class="danger" onclick="deleteReport()">Delete</button></div></div>`,'reports','reportsScreen()'))};
function reportHTML(r,shared){return `<div class="report"><div class="reportHead"><h2>${esc(r.dc)} / ${esc(r.sec)}</h2><div class="reportMeta">${new Date(r.created).toLocaleString('cs-CZ')} · ${r.items.length} foto</div></div>${r.items.map((x,i)=>`<div class="reportItem"><div class="reportNum">PHOTO ${i+1}</div><img src="${x.photo}" alt="Photo ${i+1}"><div class="reportAction">${esc(x.action)}</div>${x.comment?`<div class="reportComment">${esc(x.comment)}</div>`:''}</div>`).join('')}</div>`}
async function photoToDataURL(src){if(!src)return '';if(src.startsWith('data:'))return src;const res=await fetch(src);if(!res.ok)throw new Error('image_fetch_failed');const blob=await res.blob();return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob)})}
function clipboardReportHTML(r,photos){return `<div style="font-family:Arial,sans-serif;max-width:760px;color:#172033;background:#fff;padding:0">${r.items.map((x,i)=>`<div style="padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid #dce4ee"><img src="${photos[i]}" alt="Photo ${i+1}" style="display:block;width:100%;max-width:700px;height:auto;border-radius:10px;margin:0 0 10px"><div style="font-size:16px;font-weight:800">${esc(x.action)}</div>${x.comment?`<div style="margin-top:5px;color:#4e5f72;white-space:pre-wrap">${esc(x.comment)}</div>`:''}</div>`).join('')}</div>`}
function clipboardReportText(r){return r.items.map((x,i)=>`${x.action}${x.comment?'\n'+x.comment:''}`).join('\n\n')}
window.copyReportRich=async function(){if(!st.report){toast('Report není připraven.');return}try{toast('Připravuji Report ke kopírování…');const photos=await Promise.all(st.report.items.map(x=>photoToDataURL(x.photo)));const html=clipboardReportHTML(st.report,photos);const text=clipboardReportText(st.report);if(navigator.clipboard&&window.ClipboardItem){const item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})});await navigator.clipboard.write([item]);toast('Report zkopírován — vlož ho kamkoli.');return}const box=document.createElement('div');box.contentEditable='true';box.style.position='fixed';box.style.left='-10000px';box.innerHTML=html;document.body.appendChild(box);const range=document.createRange();range.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);const ok=document.execCommand('copy');sel.removeAllRanges();box.remove();if(!ok)throw new Error('copy_failed');toast('Report zkopírován — vlož ho kamkoli.')}catch(e){console.error(e);toast('Report se nepodařilo zkopírovat. Zkus znovu.')}};

function groupedItems(items){const order=[];const map=new Map();for(const x of items){const key=(x.action||'Bez Action').trim()||'Bez Action';if(!map.has(key)){map.set(key,[]);order.push(key)}map.get(key).push(x)}return order.flatMap(a=>map.get(a))}
function groupedDraftHTML(items){const order=[];const map=new Map();for(const x of items){const key=(x.action||'Bez Action').trim()||'Bez Action';if(!map.has(key)){map.set(key,[]);order.push(key)}map.get(key).push(x)}let n=0;return order.map(a=>`<div class="card" style="margin:10px 0 14px;padding:12px"><div class="cardTitle"><strong>📦 ${esc(a)}</strong><span class="badge">${map.get(a).length} foto</span></div>${map.get(a).map(x=>{const i=items.indexOf(x);n++;return `<div class="item"><span class="num">${n}</span><img class="thumb" src="${x.photo}"><div class="grow"><div class="itemTitle">${esc(x.action||'Bez Action')}</div><div class="itemMeta">${esc(x.comment||'Bez komentáře')}</div></div><button class="iconBtn" aria-label="Edit" onclick="editItem(${i})">✎</button><button class="iconBtn" aria-label="Delete" onclick="removeItem(${i})">×</button></div>`}).join('')}</div>`).join('')}
window.groupDraft=function(){if(st.items.length<2){toast('Pro seskupení potřebuješ alespoň 2 foto.');return}const finish=st.editingReport?'<button class="primary green" style="margin-top:9px" onclick="saveEditedReport()">💾 Uložit změny Reportu</button>':'<button class="primary green" style="margin-top:9px" onclick="createReport()">✓ Finish Report</button>';render(shell('Report',`<p class="muted">${esc(st.dc)} · ${esc(st.sec)} · ${st.items.length} foto</p>${groupedDraftHTML(st.items)}<button class="secondary" style="margin-bottom:9px" onclick="ungroupDraft()">↩ Zobrazit bez skupin</button><button class="primary" onclick="camera()">＋ Add Photo</button>${finish}`,null,'chooseSection(st.dc)'));toast('Úkoly seskupeny podle Action.');};
window.ungroupDraft=function(){review()};
window.groupSavedReport=async function(){if(!st.report||st.report.items.length<2){toast('Pro seskupení potřebuješ alespoň 2 foto.');return}st.dc=st.report.dc;st.sec=st.report.sec;st.items=structuredCloneSafe(st.report.items);st.editingReport=true;groupDraft();};
window.editSavedReport=function(){
 if(!st.report){toast('Report není připraven.');return}
 if(!st.report.share_token){toast('Tento Report nelze online upravit.');return}
 st.dc=st.report.dc;st.sec=st.report.sec;st.items=structuredCloneSafe(st.report.items);st.photo=null;st.act=null;st.comment='';st.edit=-1;st.editingReport=true;review();
};
window.saveEditedReport=async function(){
 if(!st.report||!st.report.share_token){toast('Report nelze upravit.');return}
 if(!st.items.length){toast('Report musí obsahovat alespoň jednu fotku.');return}
 try{
  toast('Ukládám změny Reportu…');
  const normalized=await Promise.all(st.items.map(async x=>({action:x.action,comment:x.comment||'',photo:await photoToDataURL(x.photo)})));
  const payload={id:st.report.id,token:st.report.share_token,dc:st.dc,section:st.sec,items:normalized};
  const res=await fetch(`${SUPABASE_URL}/functions/v1/layouttask-report`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok){const t=await res.text();throw new Error(t||'update_failed')}
  const r={...st.report,dc:st.dc,sec:st.sec,items:structuredCloneSafe(st.items)};
  r.shareUrl=location.origin+location.pathname+'?r='+encodeURIComponent(r.share_token);r.remote=true;
  await dbPut(r);reports=reports.map(x=>x.id===r.id?r:x);st.report=r;st.editingReport=false;viewReport(r.id);toast('Report aktualizován.');
 }catch(e){console.error(e);toast('Report se nepodařilo upravit. Zkus znovu.')}
};
window.deleteReport=async function(){if(!st.report||!confirm('Smazat celý Report?'))return;const id=st.report.id;try{await dbDelete(id);reports=reports.filter(r=>r.id!==id);st.report=null;reportsScreen()}catch(e){toast('Report se nepodařilo smazat.')}};
async function makeSharePayload(r){const items=[];for(const x of r.items){items.push({action:x.action,comment:x.comment||'',photo:await shrinkDataURL(x.photo,720,.48)})}return {v:1,id:r.id,dc:r.dc,sec:r.sec,created:r.created,items}}
function shrinkDataURL(src,max,quality){return new Promise((resolve,reject)=>{const im=new Image();im.onerror=reject;im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const q=Math.min(1,max/w,max/h);w=Math.max(1,Math.round(w*q));h=Math.max(1,Math.round(h*q));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};im.src=src})}
function bytesToBase64(bytes){let s='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)s+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function base64ToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function encodePayload(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));if('CompressionStream' in window){const cs=new CompressionStream('gzip');const ab=await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();return 'g.'+bytesToBase64(new Uint8Array(ab))}return 'j.'+bytesToBase64(raw)}
async function decodePayload(s){const mode=s.slice(0,2),bytes=base64ToBytes(s.slice(2));let raw=bytes;if(mode==='g.'&&'DecompressionStream' in window){const ds=new DecompressionStream('gzip');raw=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer())}return JSON.parse(new TextDecoder().decode(raw))}
async function buildReportLink(r){if(r.shareUrl)return r.shareUrl;const payload=await makeSharePayload(r);const encoded=await encodePayload(payload);return location.origin+location.pathname+'#legacy='+encoded}
window.shareReport=function(){if(!st.report){toast('Report není připraven.');return}const url=st.report.shareUrl;if(!url){toast('Odkaz ještě není připraven.');return}try{if(navigator.share){navigator.share({title:`NOTINO LayoutTask ${st.report.dc} ${st.report.sec}`,text:`Layout Report ${st.report.dc} / ${st.report.sec}`,url}).catch(e=>{if(e?.name!=='AbortError')toast('Sdílení se nepodařilo otevřít.')})}else{copyText(url).then(()=>toast('Link zkopírován.')).catch(()=>toast('Link se nepodařilo zkopírovat.'))}}catch(e){console.error(e);toast('Sdílení se nepodařilo otevřít.')}};
window.copyReportLink=function(){if(!st.report){toast('Report není připraven.');return}const url=st.report.shareUrl;if(!url){toast('Odkaz ještě není připraven.');return}copyText(url).then(()=>toast('Link zkopírován.')).catch(e=>{console.error(e);toast('Link se nepodařilo zkopírovat.')})};
async function dataURLToBlob(dataURL){const parts=dataURL.split(',');const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(parts[1]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime})}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();if(!ok)throw new Error('copy failed')}
window.settings=function(){render(shell('Settings',`${settingsList('Actions',actions,'Action')}<div class="settingsGroup">${settingsList('Sections · DC2',sections.DC2,'DC2')}</div><div class="settingsGroup">${settingsList('Sections · DC3',sections.DC3,'DC3')}</div>`,'settings'))};
function settingsList(title,arr,kind){return `<div class="card"><div class="cardTitle"><strong>${esc(title)}</strong></div>${arr.map((x,i)=>`<div class="settingsRow"><div class="settingsName">${esc(x)}</div><button class="iconBtn" onclick="rename${kind}(${i})">✎</button><button class="iconBtn" onclick="delete${kind}(${i})">×</button></div>`).join('')}<button class="secondary" onclick="add${kind}()">＋ Add</button></div>`}
window.addAction=function(){const x=prompt('Název nové Action:');if(x?.trim()){actions.push(x.trim());save(AKEY,actions);settings()}};window.renameAction=function(i){const x=prompt('Edit Action:',actions[i]);if(x?.trim()){actions[i]=x.trim();save(AKEY,actions);settings()}};window.deleteAction=function(i){if(actions.length<=1){toast('Musí zůstat alespoň jedna Action.');return}if(confirm('Delete Action?')){actions.splice(i,1);save(AKEY,actions);settings()}};
function addSec(dc){const x=prompt(`Nová Section ${dc}:`);if(x?.trim()){sections[dc].push(x.trim());save(SKEY,sections);settings()}}function renameSec(dc,i){const x=prompt('Edit Section:',sections[dc][i]);if(x?.trim()){sections[dc][i]=x.trim();save(SKEY,sections);settings()}}function deleteSec(dc,i){if(sections[dc].length<=1){toast('Musí zůstat alespoň jedna Section.');return}if(confirm('Delete Section?')){sections[dc].splice(i,1);save(SKEY,sections);settings()}}
window.addDC2=()=>addSec('DC2');window.renameDC2=i=>renameSec('DC2',i);window.deleteDC2=i=>deleteSec('DC2',i);window.addDC3=()=>addSec('DC3');window.renameDC3=i=>renameSec('DC3',i);window.deleteDC3=i=>deleteSec('DC3',i);
async function openSharedFromURL(){
 const q=new URLSearchParams(location.search||'');
 const h=location.hash||'';
 const tokenFromQuery=q.get('r');
 const tokenFromHash=h.startsWith('#r=')?h.slice(3):'';
 const sharedToken=tokenFromQuery||tokenFromHash;
 if(sharedToken){
  try{
   const token=sharedToken;
   const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);
    let res;try{res=await fetch(`${SUPABASE_URL}/functions/v1/layouttask-report?token=${encodeURIComponent(token)}`,{signal:ctrl.signal})}finally{clearTimeout(timer)}
   if(!res.ok) throw new Error('not_found');
   const data=await res.json();
   if(!data?.report||!Array.isArray(data.items)||!data.items.length) throw new Error('invalid');
   const r={id:data.report.id,dc:data.report.dc,sec:data.report.section,created:Number(data.report.created),share_token:token,shareUrl:location.origin+location.pathname+'?r='+encodeURIComponent(token),remote:true,items:data.items.map(x=>({id:x.id,action:x.action,comment:x.comment||'',photo:x.photo}))};
   document.title=`Layout Report ${r.dc} ${r.sec}`;
   render(`<div class="top">NOTINO <span>&nbsp;LayoutTask</span></div><div class="screen"><div class="eyebrow">Shared Layout Report</div>${reportHTML(r,true)}<button class="primary" style="margin-top:12px" onclick="copyReportRich()">📋 Kopírovat celý Report</button></div>`,true);st.report=r;return true;
  }catch(e){console.error(e);render(`<div class="top">NOTINO <span>&nbsp;LayoutTask</span></div><div class="screen"><div class="card"><h2>Report nelze otevřít</h2><p class="muted">Odkaz je neplatný, neúplný nebo Report už není dostupný.</p></div></div>`,true);return true}
 }
 if(h.startsWith('#legacy=')){
  try{const r=await decodePayload(h.slice(8));if(!r||!Array.isArray(r.items)||!r.items.length)throw new Error('invalid');document.title=`Layout Report ${r.dc} ${r.sec}`;render(`<div class="top">NOTINO <span>&nbsp;LayoutTask</span></div><div class="screen"><div class="eyebrow">Shared Layout Report</div>${reportHTML(r,true)}</div>`,true);return true}catch(e){console.error(e);return true}
 }
 return false
}
async function init(){
 try{if(await openSharedFromURL())return}catch(e){console.error(e)}
 try{
  await Promise.race([openDB(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('db_timeout')),2500))]);
  reports=await Promise.race([dbGetAll(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('db_read_timeout')),2500))]);
 }catch(e){console.warn('Local storage unavailable, using temporary session:',e);reports=[];db=null}
 home();
}

window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#r=')||new URLSearchParams(location.search).has('r'))openSharedFromURL()});
init();
})();
</script></body></html>
