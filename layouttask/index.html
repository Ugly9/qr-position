<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071321"><title>NOTINO LayoutTask</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050b13;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:92px;background:linear-gradient(#071321,#091522)}.top{height:60px;padding:15px 17px;font-weight:900;font-size:19px}.top span{color:#9b6dff}.screen{padding:12px 16px}.muted{color:#93a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dc{min-height:145px;border:0;border-radius:20px;padding:17px;text-align:left;color:#fff;background:linear-gradient(145deg,#1680ff,#3155d9);box-shadow:0 12px 25px #0006}.purple{background:linear-gradient(145deg,#8057ff,#4d36c9)}.dc b{display:block;font-size:26px;margin-top:24px}.card{background:#102035;border:1px solid #253b55;border-radius:18px;padding:15px;margin:12px 0}.section,.action,.primary,.secondary,.danger{width:100%;border-radius:14px;padding:14px;margin:6px 0;font-weight:850}.section{border:0;background:#f3f6fa;color:#16253a;text-align:left;display:flex;justify-content:space-between}.actions{display:grid;gap:7px}.action{border:2px solid #dce3ec;background:#f4f6fa;color:#16253a;text-align:left;display:flex;align-items:center;gap:10px}.action.on{border-color:#167eff}.dot{width:19px;height:19px;border:2px solid #728198;border-radius:5px;background:#fff}.on .dot{background:#167eff;border-color:#167eff}.check{margin-left:auto;color:#167eff}.primary{border:0;color:#fff;background:linear-gradient(90deg,#167eff,#315eff)}.green{background:linear-gradient(90deg,#13b85c,#24d879)}.secondary{border:1px solid #3a506b;background:#1a2b40;color:#fff}.danger{border:1px solid #7d3039;background:#36151b;color:#ffb6bf}.camera{height:390px;border:1px dashed #38506f;border-radius:20px;background:#172536;display:flex;align-items:center;justify-content:center;position:relative}.camera input{display:none}.shutter{position:absolute;bottom:18px;width:72px;height:72px;border-radius:50%;border:6px solid #fff;background:#fff}.photo{width:100%;max-height:420px;object-fit:contain;background:#111;border-radius:16px}.label{display:block;margin:15px 0 7px;color:#a5b5c8;font-weight:800;font-size:13px}textarea{width:100%;min-height:88px;background:#0c1725;color:#fff;border:1px solid #31445d;border-radius:12px;padding:12px}.item{display:flex;gap:9px;align-items:center;background:#0e1b2b;border:1px solid #243951;border-radius:14px;padding:9px;margin:8px 0}.grow{flex:1;min-width:0}.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px}.num{width:28px;height:28px;border-radius:8px;background:#167eff;display:grid;place-items:center;font-weight:900;flex:none}.icon{border:0;background:#edf2f7;color:#17263a;border-radius:8px;padding:8px}.report{background:#f7f9fc;color:#172033;border-radius:16px;padding:15px}.reportItem{border-bottom:1px solid #dbe2eb;padding:14px 0}.reportItem img{width:100%;max-height:460px;object-fit:contain;display:block;margin:7px 0}.settingsRow{display:flex;gap:7px;align-items:center;margin:8px 0}.settingsName{flex:1;background:#0e1b2b;border:1px solid #243951;border-radius:12px;padding:11px}.empty{text-align:center;padding:25px;color:#91a1b7}.bottom{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#07111df7;border-top:1px solid #203149;display:flex;justify-content:space-around;align-items:center}.nav{border:0;background:none;color:#8191a8;font-size:10px}.nav b{display:block;font-size:20px}.nav.active{color:#4b9cff}.fab{width:55px;height:55px;border:0;border-radius:50%;background:linear-gradient(135deg,#208aff,#7b56ff);color:#fff;font-size:28px}.toast{display:none;position:fixed;z-index:100;left:50%;bottom:88px;transform:translateX(-50%);background:#142238;border:1px solid #385170;border-radius:12px;padding:11px 15px}.shareRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.success{text-align:center;padding:8px}.annot{position:relative;background:#111;border-radius:16px;overflow:hidden}.annot canvas{display:block;width:100%;touch-action:none}.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}</style></head><body><main id="app" class="app"></main><div id="toast" class="toast"></div><script>
'use strict';
const SB='https://hsrznmfeqajffrleeyly.supabase.co/functions/v1/layouttask-report';
const AK='LT_ACTIONS_FINAL',SK='LT_SECTIONS_FINAL',DK='LayoutTaskDB';
const defA=['Obnova cedulky','Obnova layoutu','Obnova cedulky a layoutu','Vytvorit novu layout'];
const defS={DC2:['A','B','C','D','E'],DC3:['Sekce 1.01','Sekce 1.02']};
let actions=load(AK,defA),sections=load(SK,defS),reports=[],db=null;
if(!Array.isArray(actions)||!actions.length)actions=[...defA];
if(!sections||!Array.isArray(sections.DC2)||!Array.isArray(sections.DC3))sections=JSON.parse(JSON.stringify(defS));
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function render(x){document.getElementById('app').innerHTML=x}
function nav(a='home'){return '<div class="bottom"><button class="nav '+(a==='home'?'active':'')+'" onclick="home()"><b>⌂</b>Domů</button><button class="nav '+(a==='history'?'active':'')+'" onclick="historyScreen()"><b>◷</b>Historie</button><button class="fab" onclick="chooseDC()">＋</button><button class="nav '+(a==='reports'?'active')+'" onclick="reportsScreen()"><b>▤</b>Reporty</button><button class="nav '+(a==='settings'?'active')+'" onclick="settings()"><b>⚙</b>Nastavení</button></div>'}
function top(t=''){return '<div class="top">NOTINO <span>LayoutTask</span></div>'+(t?'<div class="screen"><button class="secondary" style="width:auto" onclick="home()">‹ Zpět</button><h2>'+esc(t)+'</h2></div>':'')}
function shell(t,body,a){return top(t)+'<div class="screen">'+body+'</div>'+nav(a)}
function home(){let rs=reports.slice().sort((a,b)=>b.created-a.created).slice(0,3);render(shell('', '<h1>Layout<span style="color:#9b6dff">Task</span></h1><p class="muted">Rychle. Přehledně. Efektivně.</p><div class="grid"><button class="dc" onclick="chooseSection(\'DC2\')">▣<b>DC2</b><small>Sklad DC2</small></button><button class="dc purple" onclick="chooseSection(\'DC3\')">▣<b>DC3</b><small>Sklad DC3</small></button></div><div class="card"><b>Moje poslední reporty</b>'+((rs.map(reportRow).join(''))||'<div class="empty">Zatím žádný report.</div>')+'</div>','home'))}
function chooseDC(){render(shell('Vyber DC','<p class="muted">Kde budeš provádět kontrolu?</p><div class="grid"><button class="dc" onclick="chooseSection(\'DC2\')">▣<b>DC2</b></button><button class="dc purple" onclick="chooseSection(\'DC3\')">▣<b>DC3</b></button></div>'))}
function chooseSection(dc){state.dc=dc;render(shell('Vyber sekci','<p class="muted">Sklad '+dc+'</p>'+sections[dc].map(s=>'<button class="section" onclick="start(\''+esc(s).replace(/'/g,"\\'")+'\')"><b>▣ &nbsp;'+esc(s)+'</b><b>›</b></button>').join('')))}
let state={dc:null,sec:null,photo:null,action:null,comment:'',items:[],edit:-1,report:null};
function start(sec){state.sec=sec;state.items=[];state.edit=-1;camera()}
function camera(){render(shell('Fotka problému','<p class="muted">Pořiď fotku problematického místa.</p><div class="camera"><span style="font-size:58px;opacity:.3">▧</span><input id="file" type="file" accept="image/*" capture="environment" onchange="photo(event)"><button class="shutter" onclick="file.click()"></button></div><div class="card"><b>'+esc(state.dc)+' · '+esc(state.sec)+'</b></div>'+(state.items.length?'<button class="secondary" onclick="review()">Zobrazit '+state.items.length+' foto</button>':'')+'','home'))}
function photo(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,m=1200;if(w>m||h>m){let q=Math.min(m/w,m/h);w=Math.round(w*q);h=Math.round(h*q)}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);state.photo=c.toDataURL('image/jpeg',.75);state.action=null;state.comment='';actionScreen()};im.src=r.result};r.readAsDataURL(f)}
function actionScreen(){render(shell('Co je potřeba udělat?', '<img class="photo" src="'+state.photo+'"><label class="label">Vyber akci</label><div class="actions">'+actions.map(a=>'<button class="action '+(state.action===a?'on':'')+'" onclick="selectAction(\''+esc(a).replace(/'/g,"\\'")+'\')"><span class="dot"></span><span>'+esc(a)+'</span>'+(state.action===a?'<span class="check">✓</span>':'')+'</button>').join('')+'</div><label class="label">Komentář (volitelné)</label><textarea id="comment">'+esc(state.comment)+'</textarea><button class="primary" onclick="saveItem()">✓ '+(state.edit>=0?'Uložit změny':'Uložit foto a pokračovat')+'</button><button class="secondary" onclick="camera()">Zrušit / Nová fotka</button>'))}
function selectAction(a){state.action=a;actionScreen()}
function saveItem(){state.comment=document.getElementById('comment')?.value||'';if(!state.action){toast('Vyber akci.');return}let x={id:id(),photo:state.photo,action:state.action,comment:state.comment};if(state.edit>=0){state.items[state.edit]=x;state.edit=-1}else state.items.push(x);state.photo=null;state.action=null;state.comment='';review()}
function editItem(i){state.edit=i;state.photo=state.items[i].photo;state.action=state.items[i].action;state.comment=state.items[i].comment||'';actionScreen()}
function removeItem(i){state.items.splice(i,1);review()}
function review(){render(shell('Nafocené položky','<p class="muted">'+esc(state.dc)+' · '+esc(state.sec)+' · '+state.items.length+' foto</p>'+state.items.map((x,i)=>'<div class="item"><span class="num">'+(i+1)+'</span><img class="thumb" src="'+x.photo+'"><div class="grow"><b>'+esc(x.action)+'</b><div class="muted">'+esc(x.comment||'Bez komentáře')+'</div></div><button class="icon" onclick="editItem('+i+')">✎</button><button class="icon" onclick="removeItem('+i+')">×</button></div>').join('')+'<button class="primary" onclick="camera()">＋ Přidat další foto</button><button class="secondary" onclick="groupDraft()">📦 Seskupit podle Action</button>'+(state.items.length?'<button class="primary green" onclick="createReport()">✓ Dokončit a vytvořit report</button>':'')+''))}
function groupDraft(){let groups={};state.items.forEach(x=>(groups[x.action]??=[]).push(x));render(shell('Seskupeno podle Action',Object.keys(groups).map(a=>'<div class="card"><b>📦 '+esc(a)+' · '+groups[a].length+' foto</b>'+groups[a].map(x=>'<div class="item"><img class="thumb" src="'+x.photo+'"><div class="grow">'+esc(x.comment||'Bez komentáře')+'</div></div>').join('')+'</div>').join('')+'<button class="secondary" onclick="review()">↩ Zpět</button>'))}
async function createReport(){if(!state.items.length)return toast('Nejdříve přidej foto.');try{toast('Ukládám Report…');let idv=id(),token=id(),created=Date.now(),payload={id:idv,token,dc:state.dc,section:state.sec,created,items:state.items.map(x=>({action:x.action,comment:x.comment||'',photo:x.photo}))};let r=await fetch(SB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());let d=await r.json();let rep={id:idv,share_token:d.token||token,shareUrl:location.origin+location.pathname+'?r='+encodeURIComponent(d.token||token),dc:state.dc,sec:state.sec,created,items:structuredClone(state.items),remote:true};await put(rep);reports.push(rep);state.report=rep;success(rep)}catch(e){console.error(e);toast('Report se nepodařilo uložit. Zkontroluj připojení.')}} 
function success(r){render(shell('Report vytvořen','<div class="card success"><div style="font-size:64px;color:#43dd88">✓</div><h2>Report je hotový</h2><p class="muted">'+esc(r.dc)+' · '+esc(r.sec)+' · '+r.items.length+' foto</p><button class="primary" onclick="shareReport()">📤 Odeslat odkaz na report</button><button class="secondary" onclick="copyReportRich()">📋 Kopírovat celý Report</button><div class="shareRow"><button class="secondary" onclick="copyLink()">Copy Link</button><button class="secondary" onclick="viewReport(\''+r.id+'\')">Open Report</button></div></div>'))}
function reportRow(r){return '<div class="item" onclick="viewReport(\''+r.id+'\')"><div class="grow"><b>'+esc(r.dc)+' · '+esc(r.sec)+'</b><div class="muted">'+r.items.length+' foto · '+new Date(r.created).toLocaleString('cs-CZ')+'</div></div>›</div>'}
function reportsScreen(){render(shell('Reporty',(reports.slice().sort((a,b)=>b.created-a.created).map(reportRow).join('')||'<div class="empty">Zatím žádný report.</div>'),'reports'))}
function historyScreen(){reportsScreen()}
function reportHTML(r){return '<div class="report"><h2>'+esc(r.dc)+' / '+esc(r.sec)+'</h2><div class="muted">'+new Date(r.created).toLocaleString('cs-CZ')+'</div>'+r.items.map((x,i)=>'<div class="reportItem"><b>PHOTO '+(i+1)+'</b><img src="'+x.photo+'"><strong>'+esc(x.action)+'</strong>'+(x.comment?'<p>'+esc(x.comment)+'</p>':'')+'</div>').join('')+'</div>'}
function viewReport(idv){let r=reports.find(x=>x.id===idv);if(!r)return;state.report=r;render(shell('Report',reportHTML(r)+'<button class="primary" onclick="shareReport()">📤 Odeslat odkaz na report</button><button class="secondary" onclick="copyReportRich()">📋 Kopírovat celý Report</button><button class="secondary" onclick="editSavedReport()">✎ Upravit Report</button><button class="danger" onclick="deleteReport()">🗑 Smazat</button>','reports'))}
async function editSavedReport(){if(!state.report?.share_token)return toast('Tento Report nelze online upravit.');state.dc=state.report.dc;state.sec=state.report.sec;state.items=JSON.parse(JSON.stringify(state.report.items));state.editing=true;review()}
async function saveEdited(){if(!state.report?.share_token)return;try{let payload={id:state.report.id,token:state.report.share_token,dc:state.dc,section:state.sec,items:state.items};let r=await fetch(SB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw 0;state.report={...state.report,dc:state.dc,sec:state.sec,items:JSON.parse(JSON.stringify(state.items))};await put(state.report);viewReport(state.report.id)}catch(e){toast('Úprava se nepodařila.')}}
async function deleteReport(){if(!state.report||!confirm('Smazat Report?'))return;await del(state.report.id);reports=reports.filter(r=>r.id!==state.report.id);historyScreen()}
function shareReport(){if(!state.report?.shareUrl)return toast('Link není připraven.');if(navigator.share)navigator.share({title:'NOTINO LayoutTask report',url:state.report.shareUrl}).catch(()=>{});else copyLink()}
function copyLink(){if(!state.report?.shareUrl)return;copyText(state.report.shareUrl).then(()=>toast('Link zkopírován.'))}
async function copyReportRich(){if(!state.report)return;try{let html='<div style="font-family:Arial">'+state.report.items.map(x=>'<div style="margin-bottom:18px"><img src="'+x.photo+'" style="max-width:700px;width:100%"><div><b>'+esc(x.action)+'</b></div>'+(x.comment?'<div>'+esc(x.comment)+'</div>':'')+'</div>').join('')+'</div>';let text=state.report.items.map(x=>x.action+(x.comment?'\n'+x.comment:'')).join('\n\n');if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);toast('Report zkopírován.')}else copyText(text)}catch(e){toast('Kopírování se nepodařilo.')}}
function copyText(t){return navigator.clipboard?.writeText(t)||Promise.reject()}
function settingsList(title,arr,kind){return '<div class="card"><b>'+title+'</b>'+arr.map((x,i)=>'<div class="settingsRow"><div class="settingsName">'+esc(x)+'</div><button class="icon" onclick="rename'+kind+'('+i+')">✎</button><button class="icon" onclick="delete'+kind+'('+i+')">×</button></div>').join('')+'<button class="secondary" onclick="add'+kind+'()">＋ Přidat</button></div>'}
function settings(){render(shell('Nastavení',settingsList('Akce',actions,'Action')+settingsList('SEKCE DC2',sections.DC2,'DC2')+settingsList('SEKCE DC3',sections.DC3,'DC3'),'settings'))}
function addAction(){let x=prompt('Název akce:');if(x?.trim()){actions.push(x.trim());save(AK,actions);settings()}}function renameAction(i){let x=prompt('Nový název:',actions[i]);if(x?.trim()){actions[i]=x.trim();save(AK,actions);settings()}}function deleteAction(i){if(actions.length>1&&confirm('Smazat akci?')){actions.splice(i,1);save(AK,actions);settings()}}
function secAdd(dc){let x=prompt('Nová sekce:');if(x?.trim()){sections[dc].push(x.trim());save(SK,sections);settings()}}function secRename(dc,i){let x=prompt('Nový název:',sections[dc][i]);if(x?.trim()){sections[dc][i]=x.trim();save(SK,sections);settings()}}function secDelete(dc,i){if(sections[dc].length>1&&confirm('Smazat sekci?')){sections[dc].splice(i,1);save(SK,sections);settings()}}
window.addAction=addAction;window.renameAction=renameAction;window.deleteAction=deleteAction;window.addDC2=()=>secAdd('DC2');window.renameDC2=i=>secRename('DC2',i);window.deleteDC2=i=>secDelete('DC2',i);window.addDC3=()=>secAdd('DC3');window.renameDC3=i=>secRename('DC3',i);window.deleteDC3=i=>secDelete('DC3',i);
function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DK,1);q.onupgradeneeded=()=>q.result.createObjectStore('reports',{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}function getAll(){return new Promise((res,rej)=>{let q=db.transaction('reports','readonly').objectStore('reports').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}function put(x){return new Promise((res,rej)=>{if(!db)return res();let q=db.transaction('reports','readwrite').objectStore('reports').put(x);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}function del(x){return new Promise((res,rej)=>{if(!db)return res();let q=db.transaction('reports','readwrite').objectStore('reports').delete(x);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
async function openShared(){let t=new URLSearchParams(location.search).get('r');if(!t)return false;try{let r=await fetch(SB+'?token='+encodeURIComponent(t));if(!r.ok)throw 0;let d=await r.json();let x={id:d.report.id,dc:d.report.dc,sec:d.report.section,created:Number(d.report.created),share_token:t,shareUrl:location.href,items:d.items.map(i=>({id:i.id,action:i.action,comment:i.comment||'',photo:i.photo})),remote:true};state.report=x;render(shell('Sdílený report',reportHTML(x)));return true}catch(e){render(shell('Report','<div class="card"><h2>Report nelze otevřít</h2><p class="muted">Odkaz je neplatný nebo Report není dostupný.</p></div>'));return true}}
(async()=>{if(await openShared())return;try{await openDB();reports=await getAll()}catch(e){reports=[]}home()})();
</script></body></html>
