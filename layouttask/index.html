window.photo=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var max=1100,w=im.naturalWidth,h=im.naturalHeight;if(w>max||h>max){var q=Math.min(max/w,max/h);w=Math.round(w*q);h=Math.round(h*q)}var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);st.photo=c.toDataURL('image/jpeg',.72);st.act=null;st.comment='';actionScreen()};im.onerror=function(){toast('Fotku se nepodařilo načíst.')};im.src=fr.result};fr.readAsDataURL(f)}

window.createReport=function(){if(!st.items.length){toast('Nejdříve přidej foto.');return}var r={id:String(Date.now())+Math.random(),dc:st.dc,sec:st.sec,items:JSON.parse(JSON.stringify(st.items)),created:Date.now()};reports.push(r);if(!save(RKEY,reports)){reports=reports.filter(function(x){return x.id!==r.id});toast('Report se nepodařilo uložit.');return}st.report=r;render(top('Report vytvořen')+'<div class="screen"><div class="card" style="text-align:center"><div style="font-size:65px">✓</div><h2>Report byl úspěšně vytvořen!</h2><p class="muted">Celkem '+r.items.length+' položek</p><button class="primary" style="margin-top:9px" onclick="shareReport()">🔗 Odeslat odkaz do Teams</button><button class="secondary" style="margin-top:9px" onclick="home()">← Zpět</button></div></div>'+nav())}
function wordHtml(r){return '<!doctype html><html><head><meta charset="utf-8"><meta name="ProgId" content="Word.Document"><style>@page{margin:1.6cm}body{font-family:Arial;font-size:11pt;margin:0}.item{page-break-inside:avoid;break-inside:avoid;margin:0 0 20pt}.num{font-weight:bold;margin-bottom:5pt}.photo{display:block;max-width:17cm;max-height:11cm;margin:0 0 7pt}.action{font-weight:bold;margin-bottom:4pt}.comment{margin:0}</style></head><body>'+r.items.map(function(x,i){return '<div class="item"><div class="num">'+(i+1)+'.</div><img class="photo" src="'+x.photo+'"><div class="action">'+esc(x.action)+'</div>'+(x.comment?'<div class="comment">'+esc(x.comment)+'</div>':'')+'</div>'}).join('')+'</body></html>'}
window.downloadWord=function(){if(!st.report)return;var b=new Blob([wordHtml(st.report)],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LayoutTask_'+st.report.dc+'_'+st.report.sec+'.doc';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
function pdfHtml(r){
var date=new Date(r.created).toLocaleDateString('cs-CZ');
var pages='';
for(var p=0;p<r.items.length;p+=2){
  var chunk=r.items.slice(p,p+2);

  pages+='</section>';
}
return '<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>LayoutTask report</title><style>@page{size:A4 portrait;margin:10mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#172033;font-family:Arial,Helvetica,sans-serif}.page{width:190mm;height:277mm;page-break-after:always;overflow:hidden}.page:last-child{page-break-after:auto}header{height:25mm;border-bottom:2px solid #222;display:flex;align-items:center;justify-content:space-between;margin-bottom:5mm}.brand{font-size:18pt;font-weight:800;letter-spacing:.5px}.meta{display:flex;flex-direction:column;align-items:flex-end;gap:2mm;font-size:10pt}.item{height:123mm;display:grid;grid-template-columns:105mm 1fr;gap:9mm;align-items:center;border-bottom:1px solid #cfd5dd}.item:last-child{border-bottom:0}.photoBox{width:105mm;height:112mm;display:flex;align-items:center;justify-content:center;overflow:hidden}.photoBox img{display:block;max-width:105mm;max-height:112mm;width:auto;height:auto;object-fit:contain}.info{padding-right:2mm;line-height:1.35}.num{font-size:16pt;font-weight:800;margin-bottom:7mm}.label{font-size:8.5pt;font-weight:700;color:#667085;margin-top:4mm;margin-bottom:1.5mm;text-transform:uppercase}.action{font-size:14pt;font-weight:800;overflow-wrap:anywhere}.comment{font-size:11pt;white-space:pre-wrap;overflow-wrap:anywhere}@media print{html,body{width:190mm}.page{break-after:page}.page:last-child{break-after:auto}img{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>'+pages+'</body></html>'}
function pdfBytes(data){var b64=(data||'').split(',')[1]||'',bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function pdfText(s){var m={'Č':200,'Ď':207,'É':201,'Ě':204,'Í':205,'Ň':213,'Ó':211,'Ř':216,'Š':138,'Ť':222,'Ú':218,'Ů':217,'Ý':221,'Ž':142,'č':232,'ď':239,'é':233,'ě':236,'í':237,'ň':245,'ó':243,'ř':248,'š':154,'ť':254,'ú':250,'ů':249,'ý':253,'ž':158};var a=[];String(s||'').split('').forEach(function(c){var n=m[c];if(n==null)n=c.charCodeAt(0);if(n<32||n>255)n=63;a.push(n.toString(16).padStart(2,'0'))});return '<'+a.join('').toUpperCase()+'>'}

function pdfWrap(text,maxChars){var words=String(text||'').trim().split(/\s+/),out=[],line='';words.forEach(function(w){if((line?line+' ':'')+w.length>maxChars){if(line)out.push(line);line=w}else line+=(line?' ':'')+w});if(line)out.push(line);return out.length?out:['']}
function makePDF(r){
return Promise.all(r.items.map(function(x){return pdfImgSize(x.photo)})).then(function(sizes){
var W=595,H=842,objects=[],pages=[],next=4;
function obj(body){var n=next++;objects[n]=body;return n}
objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
for(var p=0;p<r.items.length;p+=2){
 var content=[],imgs=[],chunk=r.items.slice(p,p+2);
 chunk.forEach(function(x,j){
   var i=p+j, top=j===0?800:415, bottom=j===0?425:40;
   var ix=35,iy=bottom+18,iw=275,ih=top-bottom-45,sz=sizes[i];
   var scale=Math.min(iw/sz.w,ih/sz.h),dw=Math.max(1,Math.round(sz.w*scale)),dh=Math.max(1,Math.round(sz.h*scale));
   var dx=ix+Math.round((iw-dw)/2),dy=iy+Math.round((ih-dh)/2);

   if(j===0)content.push('35 410 m 560 410 l 0.5 w S');
 });
 var stream=content.join('\n'),co=obj({kind:'stream',text:stream});
 var xobj='/Im1 '+imgs[0]+' 0 R'+(imgs[1]?' /Im2 '+imgs[1]+' 0 R':'');
 var page=obj({kind:'page',font:3,xobj:xobj,contents:co});pages.push(page);
}
objects[2]={kind:'pages',kids:pages};objects[1]={kind:'catalog'};
var chunks=[],offsets=[0],pos=0;

var xref=pos;add('xref\n0 '+objects.length+'\n0000000000 65535 f \n');for(var k=1;k<objects.length;k++)add((String(offsets[k]||0).padStart(10,'0'))+' 00000 n \n');add('trailer\n<< /Size '+objects.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
return new Blob(chunks,{type:'application/pdf'});
});
}
window.downloadPDF=function(){if(!st.report)return;makePDF(st.report).then(function(blob){var f=new File([blob],'LayoutTask_'+st.report.dc+'_'+st.report.sec+'.pdf',{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){return navigator.share({title:'LayoutTask PDF',files:[f]})}var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}).catch(function(e){toast('PDF se nepodařilo vytvořit.')})}
window.shareReport=function(){if(!st.report){toast('Report není připraven.');return}try{var payload={id:st.report.id,dc:st.report.dc,sec:st.report.sec,created:st.report.created,items:st.report.items};var encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));var url=location.origin+location.pathname+'#report='+encoded;if(navigator.share){navigator.share({title:'NOTINO LayoutTask report',text:'Sdílený report '+st.report.dc+' · '+st.report.sec,url:url}).catch(function(){})}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('Odkaz zkopírován. Vlož ho do Teams.')}).catch(function(){fallbackCopy(url)})}else fallbackCopy(url)}catch(e){toast('Odkaz se nepodařilo vytvořit.')}}
function fallbackCopy(t){var x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Odkaz zkopírován. Vlož ho do Teams.')}catch(e){toast('Odkaz nelze zkopírovat.')}x.remove()}
window.historyScreen=function(){var rs=reports.slice().sort(function(a,b){return b.created-a.created});render(top('Historie')+'<div class="screen"><p class="muted">Přehled všech reportů.</p>'+ (rs.map(function(r){return '<div class="item" onclick="viewReport(\''+r.id+'\')"><div class="grow"><b>'+esc(r.dc)+' · '+esc(r.sec)+'</b><div class="muted">'+r.items.length+' položek · '+new Date(r.created).toLocaleString('cs-CZ')+'</div></div>›</div>'}).join('')||'<div class="empty">Historie je prázdná.</div>')+'</div>'+nav('hist'))}
window.viewReport=function(id){var r=reports.find(function(x){return x.id===id});if(!r)return;st.report=r;render(top('Náhled reportu')+'<div class="screen"><div class="report">'+r.items.map(function(x,i){return '<div class="reportItem"><b>'+(i+1)+'.</b><img src="'+x.photo+'"><strong>'+esc(x.action)+'</strong>'+(x.comment?'<p>'+esc(x.comment)+'</p>':'')+'</div>'}).join('')+'</div><button class="primary" style="margin-top:10px" onclick="shareReport()">🔗 Odeslat odkaz do Teams</button><button class="danger" style="margin-top:9px" onclick="deleteReport()">🗑 Smazat report</button></div>'+nav('hist'))}
window.deleteReport=function(){if(!st.report||!confirm('Smazat report?'))return;reports=reports.filter(function(r){return r.id!==st.report.id});save(RKEY,reports);st.report=null;historyScreen()}
function settingsList(title,arr,kind){return '<div class="card"><b>'+title+'</b>'+arr.map(function(x,i){return '<div class="settingsRow"><div class="settingsName">'+esc(x)+'</div><button class="icon" onclick="rename'+kind+'('+i+')">✎</button><button class="icon" onclick="delete'+kind+'('+i+')">×</button></div>'}).join('')+'<button class="secondary" onclick="add'+kind+'()">＋ Přidat '+(kind==='Action'?'akci':'sekci')+'</button></div>'}
window.settings=function(){render(top('Nastavení')+'<div class="screen">'+settingsList('Akce',actions,'Action')+settingsList('SEKCE DC2',sections.DC2,'DC2')+settingsList('SEKCE DC3',sections.DC3,'DC3')+'</div>'+nav('set'))}
window.addAction=function(){var x=prompt('Název nové akce:');if(x&&x.trim()){actions.push(x.trim());save(AKEY,actions);settings()}}
window.renameAction=function(i){var x=prompt('Nový název:',actions[i]);if(x&&x.trim()){actions[i]=x.trim();save(AKEY,actions);settings()}}
window.deleteAction=function(i){if(actions.length<=1){toast('Musí zůstat alespoň jedna akce.');return}if(confirm('Smazat akci?')){actions.splice(i,1);save(AKEY,actions);settings()}}
function addSec(dc){var x=prompt('Název nové sekce '+dc+':');if(x&&x.trim()){sections[dc].push(x.trim());save(SKEY,sections);settings()}}
function renameSec(dc,i){var x=prompt('Nový název sekce:',sections[dc][i]);if(x&&x.trim()){sections[dc][i]=x.trim();save(SKEY,sections);settings()}}
function deleteSec(dc,i){if(sections[dc].length<=1){toast('Musí zůstat alespoň jedna sekce.');return}if(confirm('Smazat sekci?')){sections[dc].splice(i,1);save(SKEY,sections);settings()}}
window.addDC2=function(){addSec('DC2')};window.renameDC2=function(i){renameSec('DC2',i)};window.deleteDC2=function(i){deleteSec('DC2',i)};window.addDC3=function(){addSec('DC3')};window.renameDC3=function(i){renameSec('DC3',i)};window.deleteDC3=function(i){deleteSec('DC3',i)};
window.openSharedReport=function(){var h=location.hash||'';if(h.indexOf('#report=')!==0)return;try{var r=JSON.parse(decodeURIComponent(escape(atob(h.slice(8)))));if(!r||!Array.isArray(r.items)||!r.items.length)return;var body='<div class="screen"><div class="report"><h2 style="margin-top:0">Sdílený report</h2><p class="muted">'+esc(r.dc)+' · '+esc(r.sec)+'</p>';body+=r.items.map(function(x,i){return '<div class="reportItem"><b>'+(i+1)+'.</b><img src="'+x.photo+'"><strong>'+esc(x.action)+'</strong>'+(x.comment?'<p>'+esc(x.comment)+'</p>':'')+'</div>'}).join('');body+='</div></div>';render(top('Sdílený report')+body)}catch(e){}}
home();
if(location.hash&&location.hash.indexOf('#report=')===0){setTimeout(function(){window.openSharedReport()},0)}
})();</script></body></html>
